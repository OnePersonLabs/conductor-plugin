interface:
  display_name: "Set up repository workflow"
  short_description: "Set up a repository for Conductor"
  default_prompt: "Use $conductor:setup-repo-workflow only when asked to configure or migrate this repository for Conductor. Manual skills and synchronous coordination require setup but no automation authority. Default authorized to false and keep initial admission paused. Setup alone does not start a director or observer."
policy:
  allow_implicit_invocation: false
